name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  backend-lint-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint with ruff
        run: |
          ruff check app/ --output-format=github || true
        continue-on-error: true

      - name: Type check (optional)
        run: |
          pip install mypy types-requests || true
          mypy app/ --ignore-missing-imports --no-error-summary || true
        continue-on-error: true

      - name: Run tests
        env:
          # Stub env vars for tests (no real Supabase needed)
          SUPABASE_URL: "https://stub.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "stub-key-for-ci"
          BOT_OWNER_USER_ID: "00000000-0000-0000-0000-000000000000"
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Check Python syntax
        run: |
          python -m py_compile app/main.py
          python -m compileall app/ -q
