version: '3.8'

services:
  trading-bot:
    build: .
    container_name: ibkr-trading-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - default
      - ib-gateway_default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # SimulationEngine - Shadow trading simulator (optional)
  # Start with: docker-compose up -d sim-engine
  sim-engine:
    build: .
    container_name: sim-engine
    restart: unless-stopped
    command: ["python", "-m", "app.simulation.main"]
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - IB_CLIENT_ID_SIM=200
      - SIM_RISK_PER_TRADE=${SIM_RISK_PER_TRADE:-0.01}
      - SIM_MAX_OPEN_POSITIONS=${SIM_MAX_OPEN_POSITIONS:-5}
      - SIM_MAX_LEVERAGE=${SIM_MAX_LEVERAGE:-10}
      - SIM_PRICE_CHECK_INTERVAL=${SIM_PRICE_CHECK_INTERVAL:-10}
      - SIM_VERDICT_SCAN_INTERVAL=${SIM_VERDICT_SCAN_INTERVAL:-30}
    networks:
      - default
      - ib-gateway_default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - simulation  # Only starts with --profile simulation

networks:
  ib-gateway_default:
    external: true
